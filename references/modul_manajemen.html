                    <div class="w-16 h-16 rounded-2xl bg-purple-500/20 border border-purple-500/40 flex items-center justify-center text-purple-400 font-bold text-xl shadow-md">SA</div>
                    <div class="space-y-1">
                        <h2 class="text-base font-bold text-[var(--text-primary)]">Super Admin</h2>
                        <p class="text-[var(--text-secondary)]">admin@app.com</p>
                        <span class="px-2.5 py-0.5 rounded bg-purple-500/10 text-purple-400 border border-purple-500/30 text-[10px] uppercase font-bold inline-block">Role: manajemen</span>
                    </div>
                </div>
            </div>
        </div>
    `
};

function nav(key) {
    const titles = {
        dashboard: '// DASHBOARD MANAJEMEN',
        users: '// USER & ROLE MANAGEMENT',
        system: '// SYSTEM SPECIFICATIONS',
        profile: '// PROFIL SUPER ADMIN'
    };
    document.getElementById('pageTitle').innerText = titles[key] || '// DASHBOARD';
    document.getElementById('content').innerHTML = V[key] || V.dashboard;

    ['dashboard', 'users', 'system', 'profile'].forEach(k => {
        const d = document.getElementById(`s-${k}`);
        const m = document.getElementById(`m-${k}`);
        if (d) d.className = (k === key) ? 'w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold bg-purple-500/10 text-purple-400 border border-purple-500/20 transition-all cursor-pointer' : 'w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-[var(--text-secondary)] hover:bg-[var(--bg-hover)] hover:text-[var(--text-primary)] transition-colors cursor-pointer';
        if (m) m.className = (k === key) ? 'flex flex-col items-center gap-1 text-purple-400' : 'flex flex-col items-center gap-1 text-[var(--text-muted)]';
    });
}
nav('dashboard');

const html = document.documentElement;
function initTheme() {
    const saved = localStorage.getItem('theme') || 'dark';
    html.classList.toggle('dark', saved === 'dark');
    html.setAttribute('data-theme', saved);
}
document.getElementById('themeToggle')?.addEventListener('click', () => {
    const isDark = html.classList.toggle('dark');
    const mode = isDark ? 'dark' : 'light';
    html.setAttribute('data-theme', mode);
    localStorage.setItem('theme', mode);
});
initTheme();
</script>
</body>
</html>
