<!DOCTYPE html>
<html lang="id" dir="ltr" class="dark" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - Vibeforge (Dev Engine)</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23F97316'%3E%3Cpath d='M12 23c-4.97 0-9-3.134-9-7 0-2.5 1.5-5.5 3-8.5 1.5-3 1.5-5 1.5-5s3 2.5 3 5.5c0 1.5-1 3-2 4 1-1.5 2-3.5 3-6 1.5 2.5 3 5.5 3 5.5s-1 2-2.5 4c1-1 1.5-2 1.5-2s2 1.5 2 3.5c0 .5-.5 1-1 1 1.5 0 2.5 1.5 2.5 3.5 0 3.866-4.03 7-9 7z'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/assets/css/branding.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { brand: { primary: '#F97316', dark: '#0B0F17', card: '#111726', border: '#1E293B' } },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
                        heading: ['Plus Jakarta Sans', 'sans-serif'],
                        mono: ['JetBrains Mono', 'Fira Code', 'monospace']
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-primary); color: var(--text-primary); }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .tech-grid {
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 32px 32px;
        }
        .glow-mesh {
            background: radial-gradient(circle at 50% 30%, rgba(249, 115, 22, 0.12) 0%, rgba(13, 17, 23, 0) 65%);
        }
        .text-gradient {
            background: linear-gradient(135deg, #F97316 0%, #FBBF24 50%, #F59E0B 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .bg-gradient-brand { background: linear-gradient(135deg, #F97316 0%, #EA580C 100%); }
        .glow-orange-sm { box-shadow: 0 0 20px rgba(249, 115, 22, 0.15); }
        .glow-box-cyber { box-shadow: 0 0 0 1px rgba(249, 115, 22, 0.2), 0 10px 30px -10px rgba(0, 0, 0, 0.8); }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased tech-grid bg-[var(--bg-primary)]">

    <div class="absolute top-0 left-0 right-0 z-20 p-4 sm:p-6 flex justify-between items-center">
        <a href="/" class="flex items-center gap-3 group">
            <div class="w-9 h-9 rounded-xl bg-orange-500/10 border border-orange-500/30 flex items-center justify-center group-hover:border-orange-500 transition-colors shadow-[0_0_15px_rgba(249,115,22,0.2)]">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="#F97316"><path d="M12 23c-4.97 0-9-3.134-9-7 0-2.5 1.5-5.5 3-8.5 1.5-3 1.5-5 1.5-5s3 2.5 3 5.5c0 1.5-1 3-2 4 1-1.5 2-3.5 3-6 1.5 2.5 3 5.5 3 5.5s-1 2-2.5 4c1-1 1.5-2 1.5-2s2 1.5 2 3.5c0 .5-.5 1-1 1 1.5 0 2.5 1.5 2.5 3.5 0 3.866-4.03 7-9 7z"/></svg>
            </div>
            <div class="flex flex-col">
                <span class="font-heading font-extrabold text-lg tracking-tight leading-none">
                    <span class="text-[var(--text-primary)]">Vibe</span><span class="text-gradient">forge</span>
                </span>
                <span class="font-mono text-[9px] text-[var(--text-muted)] tracking-wider">DEV_ENGINE</span>
            </div>
        </a>
        <div class="flex items-center gap-3">
            <!-- Language Selector -->
            <div class="relative group" x-data="{ open: false }">
                <button @click="open = !open" @click.away="open = false" class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-[var(--bg-card)] border border-[var(--border-default)] hover:border-[var(--brand-primary)] transition-colors text-xs font-mono">
                    <img src="/assets/flags/id.svg" onerror="this.onerror=null;this.src='/assets/flags/_default.svg';" alt="id" class="w-4 h-3 rounded-sm shadow-sm">
                    <span class="uppercase font-bold text-[var(--text-secondary)]">id</span>
                    <i class="ph ph-caret-down text-xs text-[var(--text-muted)]"></i>
                </button>
                <div x-show="open" x-transition class="absolute right-0 mt-1.5 bg-[var(--bg-card)] rounded-xl shadow-2xl border border-[var(--border-default)] py-1 min-w-[150px] z-50 font-mono text-xs">
                    <a href="?lang=id" class="flex items-center gap-2.5 px-3 py-2 hover:bg-[var(--bg-hover)] transition-colors text-[var(--brand-primary)] font-bold bg-orange-500/10">
                        <img src="/assets/flags/id.svg" onerror="this.onerror=null;this.src='/assets/flags/_default.svg';" class="w-4 h-3 rounded-sm"> Bahasa Indonesia
                    </a>
                    <a href="?lang=en" class="flex items-center gap-2.5 px-3 py-2 hover:bg-[var(--bg-hover)] transition-colors text-[var(--text-secondary)]">
                        <img src="/assets/flags/en.svg" onerror="this.onerror=null;this.src='/assets/flags/_default.svg';" class="w-4 h-3 rounded-sm"> English
                    </a>
                    <a href="?lang=ja" class="flex items-center gap-2.5 px-3 py-2 hover:bg-[var(--bg-hover)] transition-colors text-[var(--text-secondary)]">
                        <img src="/assets/flags/ja.svg" onerror="this.onerror=null;this.src='/assets/flags/_default.svg';" class="w-4 h-3 rounded-sm"> 日本語
                    </a>
                    <a href="?lang=ar" class="flex items-center gap-2.5 px-3 py-2 hover:bg-[var(--bg-hover)] transition-colors text-[var(--text-secondary)]">
                        <img src="/assets/flags/ar.svg" onerror="this.onerror=null;this.src='/assets/flags/_default.svg';" class="w-4 h-3 rounded-sm"> العربية
                    </a>
                </div>
            </div>

            <!-- Theme Toggle -->
            <button id="themeToggle" class="w-9 h-9 rounded-lg bg-[var(--bg-card)] border border-[var(--border-default)] hover:border-[var(--brand-primary)] transition-colors flex items-center justify-center text-[var(--text-muted)] hover:text-amber-400" aria-label="Toggle theme">
                <i class="ph ph-moon text-lg dark:text-amber-400"></i>
            </button>
        </div>
    </div>

    <main class="flex-grow flex items-center justify-center p-4 pt-24 pb-12 relative glow-mesh">
        <div class="w-full max-w-md space-y-4">

            <div class="text-center">
                <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-orange-500/10 border border-orange-500/30 text-orange-400 font-mono text-[11px]">
                    <i class="ph ph-user-plus text-sm"></i>
                    <span>CREATE DEVELOPER ACCOUNT</span>
                </div>
            </div>

            <div class="bg-gray-950/90 backdrop-blur-xl rounded-2xl border border-[var(--border-default)] p-8 glow-box-cyber">
                <div class="text-center mb-8 space-y-2">
                    <h1 class="text-2xl font-heading font-extrabold tracking-tight text-white">Bergabung dengan Vibeforge</h1>
                    <p class="text-[var(--text-secondary)] text-xs font-mono">Buat akun untuk mulai membangun aplikasi berbasis AI.</p>
                </div>

                <div id="message" class="hidden mb-6 p-4 rounded-xl text-xs font-mono"></div>

                <form id="registerForm" class="space-y-4 font-sans">
                    <input type="hidden" name="csrf_token" value="static_csrf_token_for_reference">

                    <div>
                        <label class="block text-xs font-mono font-bold uppercase text-[var(--text-secondary)] mb-1.5">Full Name</label>
                        <div class="relative">
                            <input type="text" name="name" required class="w-full bg-gray-900 border border-[var(--border-default)] rounded-xl px-4 py-2.5 pl-11 text-xs text-[var(--text-primary)] focus:outline-none focus:border-[var(--brand-primary)] transition-colors font-mono" placeholder="Alex Dev">
                            <i class="ph ph-user absolute left-4 top-1/2 -translate-y-1/2 text-gray-500 text-base"></i>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-mono font-bold uppercase text-[var(--text-secondary)] mb-1.5">Email Address</label>
                        <div class="relative">
                            <input type="email" name="email" required class="w-full bg-gray-900 border border-[var(--border-default)] rounded-xl px-4 py-2.5 pl-11 text-xs text-[var(--text-primary)] focus:outline-none focus:border-[var(--brand-primary)] transition-colors font-mono" placeholder="alex@vibeforge.io">
                            <i class="ph ph-envelope absolute left-4 top-1/2 -translate-y-1/2 text-gray-500 text-base"></i>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-mono font-bold uppercase text-[var(--text-secondary)] mb-1.5">Password</label>
                        <div class="relative">
                            <input type="password" id="passwordInput" name="password" required minlength="8" class="w-full bg-gray-900 border border-[var(--border-default)] rounded-xl px-4 py-2.5 pl-11 pr-11 text-xs text-[var(--text-primary)] focus:outline-none focus:border-[var(--brand-primary)] transition-colors font-mono" placeholder="Minimal 8 karakter">
                            <i class="ph ph-lock absolute left-4 top-1/2 -translate-y-1/2 text-gray-500 text-base"></i>
                            <button type="button" id="togglePassword" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 hover:text-[var(--brand-primary)] transition-colors">
                                <i class="ph ph-eye text-base"></i>
                            </button>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-mono font-bold uppercase text-[var(--text-secondary)] mb-1.5">Confirm Password</label>
                        <div class="relative">
                            <input type="password" name="password_confirm" required minlength="8" class="w-full bg-gray-900 border border-[var(--border-default)] rounded-xl px-4 py-2.5 pl-11 text-xs text-[var(--text-primary)] focus:outline-none focus:border-[var(--brand-primary)] transition-colors font-mono" placeholder="Ulangi kata sandi">
                            <i class="ph ph-lock-simple absolute left-4 top-1/2 -translate-y-1/2 text-gray-500 text-base"></i>
                        </div>
                    </div>

                    <div class="flex items-start gap-2 pt-1 font-mono text-xs">
                        <input type="checkbox" required class="w-4 h-4 mt-0.5 rounded border-gray-800 bg-gray-900 text-[var(--brand-primary)] focus:ring-[var(--brand-primary)]">
                        <span class="text-[var(--text-secondary)] leading-relaxed">Saya setuju dengan <a href="#" class="text-[var(--brand-primary)] underline">Syarat & Ketentuan</a> dan <a href="#" class="text-[var(--brand-primary)] underline">Kebijakan Privasi</a></span>
                    </div>

                    <button type="submit" id="submitBtn" class="w-full py-3.5 bg-gradient-brand text-white font-mono font-bold text-xs rounded-xl hover:opacity-90 transition-opacity shadow-lg glow-orange-sm flex items-center justify-center gap-2">
                        <i class="ph ph-rocket-launch text-base"></i> BUAT AKUN DEVELOPER
                    </button>
                </form>

                <div class="mt-6 text-center font-mono text-xs text-[var(--text-secondary)]">
                    Sudah punya akun? <a href="/login/" class="text-[var(--brand-primary)] font-bold hover:underline">Masuk di sini</a>
                </div>
            </div>

            <div class="text-center">
                <a href="/" class="inline-flex items-center gap-2 font-mono text-xs text-gray-500 hover:text-[var(--brand-primary)] transition-colors">
                    <i class="ph ph-arrow-left"></i> Kembali ke Beranda
                </a>
            </div>
        </div>
    </main>

    <script>
        const html = document.documentElement;
        function initTheme() {
            const saved = localStorage.getItem('theme') || 'dark';
            html.classList.toggle('dark', saved === 'dark');
            html.setAttribute('data-theme', saved);
        }
        document.getElementById('themeToggle')?.addEventListener('click', () => {
            const isDark = html.classList.toggle('dark');
            const mode = isDark ? 'dark' : 'light';
            html.setAttribute('data-theme', mode);
            localStorage.setItem('theme', mode);
        });
        initTheme();

        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('passwordInput');
        togglePassword?.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            togglePassword.innerHTML = `<i class="ph ph-${isPassword ? 'eye-slash' : 'eye'} text-base"></i>`;
        });
    </script>
</body>
</html>
