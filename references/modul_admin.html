<!DOCTYPE html>
<html lang="id" class="dark" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creator Studio - Vibeforge (Dev Engine)</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23F97316'%3E%3Cpath d='M12 23c-4.97 0-9-3.134-9-7 0-2.5 1.5-5.5 3-8.5 1.5-3 1.5-5 1.5-5s3 2.5 3 5.5c0 1.5-1 3-2 4 1-1.5 2-3.5 3-6 1.5 2.5 3 5.5 3 5.5s-1 2-2.5 4c1-1 1.5-2 1.5-2s2 1.5 2 3.5c0 .5-.5 1-1 1 1.5 0 2.5 1.5 2.5 3.5 0 3.866-4.03 7-9 7z'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/assets/css/branding.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fff7ed',
                            100: '#ffedd5',
                            500: '#f97316',
                            600: '#ea580c',
                            700: '#c2410c',
                            primary: '#F97316',
                            hover: '#EA580C',
                            dark: '#0B0F17',
                            card: '#111726',
                            border: '#1E293B'
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
                        heading: ['Plus Jakarta Sans', 'sans-serif'],
                        mono: ['JetBrains Mono', 'Fira Code', 'monospace']
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --bg-primary: #0B0F17;
            --bg-secondary: #0F172A;
            --bg-card: #111726;
            --bg-hover: #1E293B;
            --border-default: #1E293B;
            --text-primary: #F8FAFC;
            --text-secondary: #94A3B8;
            --text-muted: #64748B;
            --brand-primary: #F97316;
            --brand-hover: #EA580C;
        }

        .light {
            --bg-primary: #F8FAFC;
            --bg-secondary: #F1F5F9;
            --bg-card: #FFFFFF;
            --bg-hover: #E2E8F0;
            --border-default: #E2E8F0;
            --text-primary: #0F172A;
            --text-secondary: #475569;
            --text-muted: #64748B;
            --brand-primary: #EA580C;
            --brand-hover: #C2410C;
        }

        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-primary); color: var(--text-primary); transition: background-color 0.3s ease, color 0.3s ease; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .tech-grid {
            background-image: linear-gradient(to right, rgba(249, 115, 22, 0.03) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(249, 115, 22, 0.03) 1px, transparent 1px);
            background-size: 36px 36px;
        }
        .dark .tech-grid {
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }
        .text-gradient {
            background: linear-gradient(135deg, #F97316 0%, #FBBF24 50%, #F59E0B 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .bg-gradient-brand { background: linear-gradient(135deg, #F97316 0%, #EA580C 100%); }
        .dark .glow-box-cyber { box-shadow: 0 0 0 1px rgba(249, 115, 22, 0.15), 0 10px 30px -10px rgba(0, 0, 0, 0.8); }
        .glow-box-cyber { box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05), 0 0 0 1px var(--border-default); }
    </style>
</head>
<body class="antialiased h-screen flex flex-col overflow-hidden tech-grid bg-[var(--bg-primary)]">

<div class="flex flex-1 overflow-hidden">
    <!-- Desktop Sidebar -->
    <aside class="hidden md:flex flex-col w-64 bg-[var(--bg-card)] border-r border-[var(--border-default)] shrink-0 font-mono transition-colors">
        <div class="h-16 flex items-center px-6 border-b border-[var(--border-default)]">
            <a href="/" class="flex items-center gap-3 group">
                <div class="w-8 h-8 rounded-xl bg-orange-500/10 border border-orange-500/30 flex items-center justify-center group-hover:border-orange-500 transition-colors shadow-[0_0_12px_rgba(249,115,22,0.2)]">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="#F97316"><path d="M12 23c-4.97 0-9-3.134-9-7 0-2.5 1.5-5.5 3-8.5 1.5-3 1.5-5 1.5-5s3 2.5 3 5.5c0 1.5-1 3-2 4 1-1.5 2-3.5 3-6 1.5 2.5 3 5.5 3 5.5s-1 2-2.5 4c1-1 1.5-2 1.5-2s2 1.5 2 3.5c0 .5-.5 1-1 1 1.5 0 2.5 1.5 2.5 3.5 0 3.866-4.03 7-9 7z"/></svg>
                </div>
                <div class="flex flex-col">
                    <span class="font-heading font-extrabold text-base tracking-tight leading-none"><span class="text-[var(--text-primary)]">Vibe</span><span class="text-gradient">forge</span></span>
                    <span class="text-[9px] text-[var(--brand-primary)] font-bold tracking-wider uppercase">CREATOR_STUDIO</span>
                </div>
            </a>
        </div>

        <nav class="flex-1 py-4 px-3 space-y-1.5 text-xs">
            <button onclick="nav('overview')" id="s-overview" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold bg-orange-500/10 text-orange-400 border border-orange-500/20 transition-all cursor-pointer"><i class="ph-fill ph-squares-four text-lg"></i> Overview</button>
            <button onclick="nav('howto')" id="s-howto" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-[var(--text-secondary)] hover:bg-[var(--bg-hover)] hover:text-[var(--text-primary)] transition-colors cursor-pointer"><i class="ph ph-book-open text-lg"></i> Workflow</button>
            <button onclick="nav('structure')" id="s-structure" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-[var(--text-secondary)] hover:bg-[var(--bg-hover)] hover:text-[var(--text-primary)] transition-colors cursor-pointer"><i class="ph ph-tree-structure text-lg"></i> Project Tree</button>
            <button onclick="nav('profile')" id="s-profile" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-[var(--text-secondary)] hover:bg-[var(--bg-hover)] hover:text-[var(--text-primary)] transition-colors cursor-pointer"><i class="ph ph-user text-lg"></i> Profil</button>
        </nav>

        <div class="p-4 border-t border-[var(--border-default)] bg-[var(--bg-secondary)]/50">
            <div class="flex items-center gap-3 px-2 py-1.5">
                <div class="w-9 h-9 rounded-xl bg-orange-500/20 border border-orange-500/40 flex items-center justify-center text-orange-400 font-bold text-xs shadow-sm">AC</div>
                <div class="overflow-hidden">
                    <p class="text-xs font-bold text-[var(--text-primary)] truncate">Admin Creator</p>
                    <p class="text-[10px] text-orange-400 uppercase font-semibold">Creator Role</p>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col overflow-hidden">
        <header class="h-16 flex items-center justify-between px-6 bg-[var(--bg-card)]/90 backdrop-blur-md border-b border-[var(--border-default)] shrink-0 font-mono text-xs z-10 transition-colors">
            <div class="flex items-center gap-3">
                <h1 id="pageTitle" class="font-heading font-extrabold text-sm text-[var(--text-primary)] tracking-wide uppercase">// CREATOR OVERVIEW</h1>
                <span class="px-2.5 py-0.5 rounded-full bg-orange-500/10 text-orange-400 border border-orange-500/20 text-[10px] font-bold">BUILD_ACTIVE</span>
            </div>
            <div class="flex items-center gap-3">
                <!-- Language Selector -->
                <div class="relative group" x-data="{ open: false }">
                    <button @click="open = !open" @click.away="open = false" class="flex items-center gap-2 px-2.5 py-1.5 rounded-lg bg-[var(--bg-primary)] border border-[var(--border-default)] hover:border-orange-500 transition-colors text-xs cursor-pointer" aria-label="Change Language">
                        <img src="/assets/flags/id.svg" onerror="this.onerror=null;this.src='/assets/flags/_default.svg';" alt="id" class="w-4 h-3 rounded-sm shadow-sm">
                        <span class="hidden sm:inline uppercase font-bold text-[var(--text-secondary)]">id</span>
                        <i class="ph ph-caret-down text-xs text-[var(--text-muted)]"></i>
                    </button>
                    <div x-show="open" x-transition class="absolute right-0 mt-1 bg-[var(--bg-card)] rounded-xl shadow-2xl border border-[var(--border-default)] py-1 min-w-[160px] z-50 text-xs font-mono">
                        <a href="?lang=id" class="flex items-center gap-2.5 px-3 py-2 hover:bg-[var(--bg-hover)] transition-colors text-[var(--brand-primary)] font-bold bg-orange-500/10">
                            <img src="/assets/flags/id.svg" onerror="this.onerror=null;this.src='/assets/flags/_default.svg';" class="w-4 h-3 rounded-sm"> Bahasa Indonesia
                        </a>
                        <a href="?lang=en" class="flex items-center gap-2.5 px-3 py-2 hover:bg-[var(--bg-hover)] transition-colors text-[var(--text-secondary)]">
                            <img src="/assets/flags/en.svg" onerror="this.onerror=null;this.src='/assets/flags/_default.svg';" class="w-4 h-3 rounded-sm"> English
                        </a>
                    </div>
                </div>

                <button id="themeToggle" class="w-9 h-9 rounded-lg bg-[var(--bg-primary)] border border-[var(--border-default)] hover:border-[var(--brand-primary)] flex items-center justify-center transition-colors text-[var(--text-muted)] hover:text-amber-400 cursor-pointer" aria-label="Toggle theme"><i class="ph ph-moon text-base dark:text-amber-400"></i></button>
                <a href="/logout/" class="w-9 h-9 rounded-lg bg-[var(--bg-primary)] border border-[var(--border-default)] hover:border-red-500/40 flex items-center justify-center transition-colors text-red-400 hover:bg-red-500/10" title="Logout"><i class="ph ph-sign-out text-base"></i></a>
            </div>
        </header>

        <div id="content" class="flex-1 overflow-y-auto p-6 pb-24 md:pb-6 font-sans"></div>
    </main>
</div>

<!-- Mobile Bottom Nav -->
<nav class="md:hidden fixed bottom-0 left-0 right-0 bg-[var(--bg-card)]/95 backdrop-blur-md border-t border-[var(--border-default)] z-50 font-mono text-xs shadow-lg">
    <div class="flex justify-around items-center h-16">
        <button onclick="nav('overview')" class="flex flex-col items-center gap-1 text-[var(--brand-primary)]" id="m-overview"><i class="ph-fill ph-squares-four text-xl"></i><span class="text-[9px] font-semibold">Overview</span></button>
        <button onclick="nav('howto')" class="flex flex-col items-center gap-1 text-[var(--text-muted)]" id="m-howto"><i class="ph ph-book-open text-xl"></i><span class="text-[9px] font-semibold">Workflow</span></button>
        <button onclick="nav('structure')" class="flex flex-col items-center gap-1 text-[var(--text-muted)]" id="m-structure"><i class="ph ph-tree-structure text-xl"></i><span class="text-[9px] font-semibold">Tree</span></button>
        <button onclick="nav('profile')" class="flex flex-col items-center gap-1 text-[var(--text-muted)]" id="m-profile"><i class="ph ph-user text-xl"></i><span class="text-[9px] font-semibold">Profil</span></button>
    </div>
</nav>

<script>
const V = {
    overview: `
        <div class="space-y-6">
            <div class="bg-[var(--bg-card)] rounded-2xl border border-[var(--border-default)] p-6 glow-box-cyber font-mono space-y-2 relative overflow-hidden">
                <div class="absolute -top-10 -right-10 w-32 h-32 bg-orange-500/10 rounded-full blur-2xl pointer-events-none"></div>
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                    <h2 class="text-xl font-bold text-[var(--text-primary)]">Selamat Datang, Admin Creator!</h2>
                    <span class="px-3 py-1 rounded-full bg-orange-500/10 border border-orange-500/30 text-[var(--brand-primary)] text-[10px] font-bold self-start sm:self-auto uppercase tracking-wider">ADMIN ROLE // CREATOR</span>
                </div>
                <p class="text-xs text-[var(--text-secondary)] font-sans leading-relaxed">Ruang kerja creator untuk memantau performa, memproses konten, dan mengelola struktur proyek vibe coding.</p>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 font-mono text-xs">
                <div class="bg-[var(--bg-card)] rounded-2xl border border-[var(--border-default)] p-5 glow-box-cyber space-y-2 hover:border-orange-500/40 transition-colors">
                    <div class="flex items-center justify-between text-[var(--text-muted)]">
                        <span>Total Modules</span>
                        <div class="w-8 h-8 rounded-lg bg-orange-500/10 flex items-center justify-center text-[var(--brand-primary)]">
                            <i class="ph ph-squares-four text-lg"></i>
                        </div>
                    </div>
                    <p class="text-2xl font-bold text-[var(--text-primary)]">6</p>
                    <span class="text-[10px] text-[var(--brand-primary)] font-semibold">Auth, Admin, Client, Manajemen</span>
                </div>

                <div class="bg-[var(--bg-card)] rounded-2xl border border-[var(--border-default)] p-5 glow-box-cyber space-y-2 hover:border-amber-500/40 transition-colors">
                    <div class="flex items-center justify-between text-[var(--text-muted)]">
                        <span>Active Shells</span>
                        <div class="w-8 h-8 rounded-lg bg-amber-500/10 flex items-center justify-center text-amber-400">
                            <i class="ph ph-layout text-lg"></i>
                        </div>
                    </div>
                    <p class="text-2xl font-bold text-[var(--text-primary)]">5</p>
                    <span class="text-[10px] text-[var(--text-muted)]">public/*/index.php Clean-URL</span>
                </div>

                <div class="bg-[var(--bg-card)] rounded-2xl border border-[var(--border-default)] p-5 glow-box-cyber space-y-2 hover:border-emerald-500/40 transition-colors">
                    <div class="flex items-center justify-between text-[var(--text-muted)]">
                        <span>Router Proxy</span>
                        <div class="w-8 h-8 rounded-lg bg-emerald-500/10 flex items-center justify-center text-emerald-400">
                            <i class="ph ph-flow-arrow text-lg"></i>
                        </div>
                    </div>
                    <p class="text-2xl font-bold text-emerald-400">ACTIVE</p>
                    <span class="text-[10px] text-[var(--text-muted)]">public/core/router.php proxy</span>
                </div>

                <div class="bg-[var(--bg-card)] rounded-2xl border border-[var(--border-default)] p-5 glow-box-cyber space-y-2 hover:border-indigo-500/40 transition-colors">
                    <div class="flex items-center justify-between text-[var(--text-muted)]">
                        <span>Build Engine</span>
                        <div class="w-8 h-8 rounded-lg bg-indigo-500/10 flex items-center justify-center text-indigo-400">
                            <i class="ph ph-terminal text-lg"></i>
                        </div>
                    </div>
                    <p class="text-2xl font-bold text-[var(--text-primary)]">STABLE</p>
                    <span class="text-[10px] text-indigo-400 font-semibold">Vibeforge Vibe Engine</span>
                </div>
            </div>
        </div>
    `,
    howto: `
        <div class="space-y-6 font-mono text-xs">
            <div class="bg-[var(--bg-card)] rounded-2xl border border-[var(--border-default)] p-6 glow-box-cyber space-y-4">
                <h2 class="text-base font-bold text-[var(--text-primary)] flex items-center gap-2">
                    <i class="ph ph-git-merge text-[var(--brand-primary)] text-lg"></i> VIBE CODING WORKFLOW STEPS
                </h2>
                <div class="grid md:grid-cols-3 gap-4 font-sans">
                    <div class="p-4 rounded-xl bg-[var(--bg-secondary)] border border-[var(--border-default)] space-y-2 hover:border-orange-500/30 transition-colors">
                        <span class="text-[var(--brand-primary)] font-mono font-bold text-xs">Step 1: Write Spec</span>
                        <p class="text-xs text-[var(--text-secondary)] leading-relaxed">Tulis kebutuhan aplikasi di <code class="px-1 py-0.5 bg-[var(--bg-primary)] text-[var(--brand-primary)] font-mono rounded border border-[var(--border-default)]">docs/prd.md</code> & <code class="px-1 py-0.5 bg-[var(--bg-primary)] text-[var(--brand-primary)] font-mono rounded border border-[var(--border-default)]">docs/branding.md</code>.</p>
                    </div>
                    <div class="p-4 rounded-xl bg-[var(--bg-secondary)] border border-[var(--border-default)] space-y-2 hover:border-orange-500/30 transition-colors">
                        <span class="text-[var(--brand-primary)] font-mono font-bold text-xs">Step 2: AI Execution</span>
                        <p class="text-xs text-[var(--text-secondary)] leading-relaxed">Gunakan Claude Code CLI atau Cursor untuk mengaudit dan mengeksekusi fitur.</p>
                    </div>
                    <div class="p-4 rounded-xl bg-[var(--bg-secondary)] border border-[var(--border-default)] space-y-2 hover:border-orange-500/30 transition-colors">
                        <span class="text-[var(--brand-primary)] font-mono font-bold text-xs">Step 3: Verification</span>
                        <p class="text-xs text-[var(--text-secondary)] leading-relaxed">Test secara manual di browser dan pastikan log debug bersih di <code class="px-1 py-0.5 bg-[var(--bg-primary)] text-[var(--brand-primary)] font-mono rounded border border-[var(--border-default)]">cache/debug.log</code>.</p>
                    </div>
                </div>
            </div>
        </div>
    `,
    structure: `
        <div class="space-y-6 font-mono text-xs">
            <div class="bg-[var(--bg-card)] rounded-2xl border border-[var(--border-default)] p-6 glow-box-cyber space-y-4">
                <h2 class="text-base font-bold text-[var(--text-primary)] flex items-center gap-2">
                    <i class="ph ph-tree-structure text-[var(--brand-primary)] text-lg"></i> PROJECT TREE ARCHITECTURE
                </h2>
                <div class="bg-[var(--bg-secondary)] p-4 rounded-xl border border-[var(--border-default)] text-[var(--text-secondary)] space-y-1.5 overflow-x-auto">
                    <div class="text-[var(--text-primary)] font-bold">project-root/</div>
                    <div>├── public/                  <span class="text-[var(--text-muted)] font-normal">&lt;- document root Apache</span></div>
                    <div>│   ├── index.php            <span class="text-[var(--text-muted)] font-normal">&lt;- Shell landing page</span></div>
                    <div>│   ├── login/index.php      <span class="text-[var(--text-muted)] font-normal">&lt;- Shell auth login</span></div>
                    <div>│   ├── manajemen/index.php  <span class="text-[var(--text-muted)] font-normal">&lt;- Shell Super Admin</span></div>
                    <div>│   └── core/router.php      <span class="text-[var(--text-muted)] font-normal">&lt;- Router Proxy (WAJIB)</span></div>
                    <div>├── core/                    <span class="text-[var(--text-muted)] font-normal">&lt;- router.php, Repo.php (dual mode)</span></div>
                    <div>├── include/                 <span class="text-[var(--text-muted)] font-normal">&lt;- config.php, helper.php</span></div>
                    <div>└── modules/                 <span class="text-[var(--text-muted)] font-normal">&lt;- Modul AJAX per role</span></div>
                </div>
            </div>
        </div>
    `,
    profile: `
        <div class="max-w-xl space-y-6 font-mono text-xs">
            <div class="bg-[var(--bg-card)] rounded-2xl border border-[var(--border-default)] p-6 glow-box-cyber space-y-6">
                <div class="flex items-center gap-4">
                    <div class="w-16 h-16 rounded-2xl bg-orange-500/20 border border-orange-500/40 flex items-center justify-center text-orange-400 font-bold text-xl shadow-md">AC</div>
                    <div class="space-y-1">
                        <h2 class="text-base font-bold text-[var(--text-primary)]">Admin Creator</h2>
                        <p class="text-[var(--text-secondary)]">admin@app.id</p>
                        <span class="px-2.5 py-0.5 rounded bg-orange-500/10 text-orange-400 border border-orange-500/30 text-[10px] uppercase font-bold inline-block">Role: admin</span>
                    </div>
                </div>
            </div>
        </div>
    `
};

function nav(key) {
    const titles = {
        overview: '// CREATOR OVERVIEW',
        howto: '// VIBE CODING WORKFLOW',
        structure: '// PROJECT TREE ARCHITECTURE',
        profile: '// PROFIL CREATOR ADMIN'
    };
    document.getElementById('pageTitle').innerText = titles[key] || '// OVERVIEW';
    document.getElementById('content').innerHTML = V[key] || V.overview;

    ['overview', 'howto', 'structure', 'profile'].forEach(k => {
        const d = document.getElementById(`s-${k}`);
        const m = document.getElementById(`m-${k}`);
        if (d) d.className = (k === key) ? 'w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold bg-orange-500/10 text-orange-400 border border-orange-500/20 transition-all cursor-pointer' : 'w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-[var(--text-secondary)] hover:bg-[var(--bg-hover)] hover:text-[var(--text-primary)] transition-colors cursor-pointer';
        if (m) m.className = (k === key) ? 'flex flex-col items-center gap-1 text-[var(--brand-primary)]' : 'flex flex-col items-center gap-1 text-[var(--text-muted)]';
    });
}
nav('overview');

const html = document.documentElement;
function initTheme() {
    const saved = localStorage.getItem('theme') || 'dark';
    html.classList.toggle('dark', saved === 'dark');
    html.setAttribute('data-theme', saved);
}
document.getElementById('themeToggle')?.addEventListener('click', () => {
    const isDark = html.classList.toggle('dark');
    const mode = isDark ? 'dark' : 'light';
    html.setAttribute('data-theme', mode);
    localStorage.setItem('theme', mode);
});
initTheme();
</script>
</body>
</html>
