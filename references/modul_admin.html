<!DOCTYPE html>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/assets/css/branding.css">
    <script>tailwind.config={darkMode:'class',theme:{extend:{colors:{brand:{primary:'#F97316',dark:'#0D1117',card:'#161B22'}}}}}</script>
    <style>
        body{font-family:'Inter',sans-serif;background-color:var(--bg-primary);color:var(--text-primary)}
        h1,h2,h3{font-family:'Poppins',sans-serif}
        .text-gradient{background:linear-gradient(135deg,#FF6B35,#F59E0B);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        .bg-gradient-brand{background:linear-gradient(135deg,#FF6B35,#F59E0B)}
    </style>
</head>
<body class="antialiased h-screen flex flex-col overflow-hidden">

<div class="flex flex-1 overflow-hidden">
    <!-- Sidebar -->
    <aside class="hidden md:flex flex-col w-64 bg-[var(--bg-card)] border-r border-[var(--border-default)] shrink-0">
        <div class="h-16 flex items-center px-6 border-b border-[var(--border-default)]">
            <a href="/" class="flex items-center gap-2">

        <nav class="flex-1 py-4 px-3 space-y-1">

            </button>
            <button onclick="nav('howto')" id="s-howto" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-[var(--text-secondary)] hover:bg-[var(--bg-hover)] transition-colors">
                <i class="ph ph-book-open text-xl"></i> Cara Kerja
            </button>
            <button onclick="nav('structure')" id="s-structure" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-[var(--text-secondary)] hover:bg-[var(--bg-hover)] transition-colors">
                <i class="ph ph-tree-structure text-xl"></i> Struktur
            </button>
            <button onclick="nav('profile')" id="s-profile" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-[var(--text-secondary)] hover:bg-[var(--bg-hover)] transition-colors">

                    AC

    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col overflow-hidden">
        <header class="h-16 flex items-center justify-between px-6 bg-[var(--bg-secondary)] border-b border-[var(--border-default)] shrink-0">
            <h1 id="pageTitle" class="font-heading font-semibold">Overview</h1>
            <div class="flex items-center gap-2">
                <!-- Language Selector -->
                <div class="relative group" x-data="{ open: false }">
                    <button @click="open = !open" @click.away="open = false" class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg bg-[var(--bg-card)] border border-[var(--border-default)] hover:border-[var(--brand-primary)] transition-colors text-xs font-medium" aria-label="Change Language">
                        <img src="/assets/flags/id.svg" onerror="this.onerror=null;this.src='/assets/flags/_default.svg';" alt="id" class="w-5 h-3.5 rounded-sm shadow-sm">
                        <span class="hidden sm:inline uppercase font-bold text-[var(--text-secondary)]">id</span>
                        <i class="ph ph-caret-down text-xs text-[var(--text-muted)]"></i>
                    </button>
                    <div x-show="open" x-transition class="absolute right-0 mt-1 bg-[var(--bg-card)] rounded-xl shadow-2xl border border-[var(--border-default)] py-1 min-w-[150px] z-50">
                        <a href="?lang=id" class="flex items-center gap-2.5 px-3 py-2 text-xs hover:bg-[var(--bg-hover)] transition-colors text-[var(--brand-primary)] font-bold bg-[var(--brand-primary-light)]/10">
                            <img src="/assets/flags/id.svg" onerror="this.onerror=null;this.src='/assets/flags/_default.svg';" class="w-5 h-3.5 rounded-sm"> Bahasa Indonesia
                        </a>
                        <a href="?lang=en" class="flex items-center gap-2.5 px-3 py-2 text-xs hover:bg-[var(--bg-hover)] transition-colors text-[var(--text-secondary)]">
                            <img src="/assets/flags/en.svg" onerror="this.onerror=null;this.src='/assets/flags/_default.svg';" class="w-5 h-3.5 rounded-sm"> English
                        </a>
                        <a href="?lang=ar" class="flex items-center gap-2.5 px-3 py-2 text-xs hover:bg-[var(--bg-hover)] transition-colors text-[var(--text-secondary)]">
                            <img src="/assets/flags/ar.svg" onerror="this.onerror=null;this.src='/assets/flags/_default.svg';" class="w-5 h-3.5 rounded-sm"> العربية
                        </a>
                    </div>
                </div>

                <button id="themeToggle" class="p-2 hover:bg-[var(--bg-hover)] rounded-lg" aria-label="Toggle theme">
                    <i class="ph ph-moon text-lg text-[var(--brand-primary)]"></i>
                </button>
                <a href="/logout/" class="p-2 hover:bg-red-500/10 rounded-lg text-red-400" title="Logout">

        </header>

        <div id="content" class="flex-1 overflow-y-auto p-6 pb-24 md:pb-6"></div>
    </main>
</div>

<!-- Mobile Navigation -->
<nav class="md:hidden fixed bottom-0 left-0 right-0 bg-[var(--bg-card)] border-t border-[var(--border-default)] z-50">
    <div class="flex justify-around items-center h-16">

function nav(p) {
    document.getElementById('content').innerHTML = V[p] || V.overview;
    document.getElementById('pageTitle').textContent = {overview:'Overview',howto:'Cara Kerja',structure:'Struktur',profile:'Profil'}[p]||'Overview';

    ['overview','howto','structure','profile'].forEach(k => {
        const d = document.getElementById('s-' + k);
        const m = document.getElementById('m-' + k);
        if (d) {
            if (k === p) {
                d.className = 'w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium bg-[var(--brand-primary-light)] text-[var(--brand-primary)]';
            } else {
                d.className = 'w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-[var(--text-secondary)] hover:bg-[var(--bg-hover)] transition-colors';
            }
        }
        if (m) {
            if (k === p) {
                m.className = 'flex flex-col items-center gap-1 text-[var(--brand-primary)]';
            } else {
                m.className = 'flex flex-col items-center gap-1 text-[var(--text-muted)]';
            }
        }
    });
}

const html = document.documentElement;
document.getElementById('themeToggle')?.addEventListener('click', () => {
    const isDark = html.classList.toggle('dark');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
});
(() => {
    const saved = localStorage.getItem('theme') || 'dark';
    html.classList.toggle('dark', saved === 'dark');
})();
nav('overview');
</script>
</body>
</html>
