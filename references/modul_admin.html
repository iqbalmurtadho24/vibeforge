<!DOCTYPE html>
<html lang="id" class="dark" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creator Studio - Vibeforge (Dev Engine)</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23F97316'%3E%3Cpath d='M12 23c-4.97 0-9-3.134-9-7 0-2.5 1.5-5.5 3-8.5 1.5-3 1.5-5 1.5-5s3 2.5 3 5.5c0 1.5-1 3-2 4 1-1.5 2-3.5 3-6 1.5 2.5 3 5.5 3 5.5s-1 2-2.5 4c1-1 1.5-2 1.5-2s2 1.5 2 3.5c0 .5-.5 1-1 1 1.5 0 2.5 1.5 2.5 3.5 0 3.866-4.03 7-9 7z'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/assets/css/branding.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { brand: { primary: '#F97316', dark: '#0B0F17', card: '#111726', border: '#1E293B' } },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
                        heading: ['Plus Jakarta Sans', 'sans-serif'],
                        mono: ['JetBrains Mono', 'Fira Code', 'monospace']
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-primary); color: var(--text-primary); }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .tech-grid {
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 32px 32px;
        }
        .text-gradient {
            background: linear-gradient(135deg, #F97316 0%, #FBBF24 50%, #F59E0B 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .bg-gradient-brand { background: linear-gradient(135deg, #F97316 0%, #EA580C 100%); }
        .glow-box-cyber { box-shadow: 0 0 0 1px rgba(249, 115, 22, 0.2), 0 10px 30px -10px rgba(0, 0, 0, 0.8); }
    </style>
</head>
<body class="antialiased h-screen flex flex-col overflow-hidden tech-grid bg-[var(--bg-primary)]">

<div class="flex flex-1 overflow-hidden">
    <!-- Desktop Sidebar -->
    <aside class="hidden md:flex flex-col w-64 bg-gray-950 border-r border-[var(--border-default)] shrink-0 font-mono">
        <div class="h-16 flex items-center px-6 border-b border-[var(--border-default)]">
            <a href="/" class="flex items-center gap-3 group">
                <div class="w-8 h-8 rounded-xl bg-orange-500/10 border border-orange-500/30 flex items-center justify-center group-hover:border-orange-500 transition-colors">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="#F97316"><path d="M12 23c-4.97 0-9-3.134-9-7 0-2.5 1.5-5.5 3-8.5 1.5-3 1.5-5 1.5-5s3 2.5 3 5.5c0 1.5-1 3-2 4 1-1.5 2-3.5 3-6 1.5 2.5 3 5.5 3 5.5s-1 2-2.5 4c1-1 1.5-2 1.5-2s2 1.5 2 3.5c0 .5-.5 1-1 1 1.5 0 2.5 1.5 2.5 3.5 0 3.866-4.03 7-9 7z"/></svg>
                </div>
                <div class="flex flex-col">
                    <span class="font-heading font-extrabold text-base tracking-tight leading-none"><span class="text-white">Vibe</span><span class="text-gradient">forge</span></span>
                    <span class="text-[9px] text-orange-400 font-bold tracking-wider uppercase">CREATOR_STUDIO</span>
                </div>
            </a>
        </div>

        <nav class="flex-1 py-4 px-3 space-y-1 text-xs">
            <button onclick="nav('overview')" id="s-overview" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold bg-orange-500/10 text-orange-400 border border-orange-500/20 transition-all"><i class="ph-fill ph-squares-four text-lg"></i> Overview</button>
            <button onclick="nav('howto')" id="s-howto" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-gray-400 hover:bg-gray-900 hover:text-white transition-colors"><i class="ph ph-book-open text-lg"></i> Workflow</button>
            <button onclick="nav('structure')" id="s-structure" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-gray-400 hover:bg-gray-900 hover:text-white transition-colors"><i class="ph ph-tree-structure text-lg"></i> Project Tree</button>
            <button onclick="nav('profile')" id="s-profile" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-gray-400 hover:bg-gray-900 hover:text-white transition-colors"><i class="ph ph-user text-lg"></i> Profil</button>
        </nav>

        <div class="p-4 border-t border-[var(--border-default)] bg-gray-900/50">
            <div class="flex items-center gap-3 px-2 py-1.5">
                <div class="w-9 h-9 rounded-xl bg-orange-500/20 border border-orange-500/40 flex items-center justify-center text-orange-400 font-bold text-xs">AC</div>
                <div class="overflow-hidden">
                    <p class="text-xs font-bold text-white truncate">Admin Creator</p>
                    <p class="text-[10px] text-orange-400 uppercase font-semibold">Creator Role</p>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col overflow-hidden">
        <header class="h-16 flex items-center justify-between px-6 bg-gray-950/80 border-b border-[var(--border-default)] shrink-0 font-mono text-xs">
            <div class="flex items-center gap-3">
                <h1 id="pageTitle" class="font-heading font-extrabold text-sm text-white tracking-wide uppercase">// CREATOR OVERVIEW</h1>
                <span class="px-2 py-0.5 rounded bg-orange-500/10 text-orange-400 border border-orange-500/20 text-[10px]">BUILD_ACTIVE</span>
            </div>
            <div class="flex items-center gap-3">
                <!-- Language Selector -->
                <div class="relative group" x-data="{ open: false }">
                    <button @click="open = !open" @click.away="open = false" class="flex items-center gap-2 px-2.5 py-1.5 rounded-lg bg-gray-900 border border-gray-800 hover:border-orange-500 transition-colors text-xs" aria-label="Change Language">
                        <img src="/assets/flags/id.svg" onerror="this.onerror=null;this.src='/assets/flags/_default.svg';" alt="id" class="w-4 h-3 rounded-sm">
                        <span class="hidden sm:inline uppercase font-bold text-gray-300">id</span>
                        <i class="ph ph-caret-down text-xs text-gray-500"></i>
                    </button>
                    <div x-show="open" x-transition class="absolute right-0 mt-1 bg-gray-900 rounded-xl shadow-2xl border border-gray-800 py-1 min-w-[150px] z-50 text-xs">
                        <a href="?lang=id" class="flex items-center gap-2.5 px-3 py-2 hover:bg-gray-800 transition-colors text-orange-400 font-bold bg-orange-500/10">
                            <img src="/assets/flags/id.svg" onerror="this.onerror=null;this.src='/assets/flags/_default.svg';" class="w-4 h-3 rounded-sm"> Bahasa Indonesia
                        </a>
                        <a href="?lang=en" class="flex items-center gap-2.5 px-3 py-2 hover:bg-gray-800 transition-colors text-gray-300">
                            <img src="/assets/flags/en.svg" onerror="this.onerror=null;this.src='/assets/flags/_default.svg';" class="w-4 h-3 rounded-sm"> English
                        </a>
                    </div>
                </div>

                <button id="themeToggle" class="p-2 hover:bg-gray-800 rounded-lg text-amber-400" aria-label="Toggle theme"><i class="ph ph-moon text-base"></i></button>
                <a href="/logout/" class="p-2 hover:bg-red-500/10 rounded-lg text-red-400" title="Logout"><i class="ph ph-sign-out text-base"></i></a>
            </div>
        </header>

        <div id="content" class="flex-1 overflow-y-auto p-6 pb-24 md:pb-6 font-sans"></div>
    </main>
</div>

<!-- Mobile Bottom Nav -->
<nav class="md:hidden fixed bottom-0 left-0 right-0 bg-gray-950 border-t border-gray-800 z-50 font-mono text-xs">
    <div class="flex justify-around items-center h-16">
        <button onclick="nav('overview')" class="flex flex-col items-center gap-1 text-orange-400" id="m-overview"><i class="ph-fill ph-squares-four text-xl"></i><span class="text-[9px]">Overview</span></button>
        <button onclick="nav('howto')" class="flex flex-col items-center gap-1 text-gray-400" id="m-howto"><i class="ph ph-book-open text-xl"></i><span class="text-[9px]">Workflow</span></button>
        <button onclick="nav('structure')" class="flex flex-col items-center gap-1 text-gray-400" id="m-structure"><i class="ph ph-tree-structure text-xl"></i><span class="text-[9px]">Tree</span></button>
        <button onclick="nav('profile')" class="flex flex-col items-center gap-1 text-gray-400" id="m-profile"><i class="ph ph-user text-xl"></i><span class="text-[9px]">Profil</span></button>
    </div>
</nav>

<script>
const V = {
    overview: `
        <div class="space-y-6">
            <div class="bg-gray-950/90 rounded-2xl border border-gray-800 p-6 glow-box-cyber font-mono space-y-2">
                <div class="flex items-center justify-between">
                    <h2 class="text-xl font-bold text-white">Selamat Datang, Admin Creator!</h2>
                    <span class="px-2.5 py-1 rounded-full bg-orange-500/10 border border-orange-500/30 text-orange-400 text-[10px] font-bold">ADMIN ROLE</span>
                </div>
                <p class="text-xs text-gray-400 font-sans">Ruang kerja creator untuk memantau performa, memproses konten, dan mengelola struktur proyek.</p>
            </div>

            <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 font-mono text-xs">
                <div class="bg-gray-950/90 rounded-2xl border border-gray-800 p-5 glow-box-cyber space-y-2">
                    <div class="flex items-center justify-between text-gray-400">
                        <span>Total Modules</span>
                        <i class="ph ph-squares-four text-orange-400 text-xl"></i>
                    </div>
                    <p class="text-2xl font-bold text-white">6</p>
                    <span class="text-[10px] text-orange-400">Auth, Admin, Client, Manajemen</span>
                </div>

                <div class="bg-gray-950/90 rounded-2xl border border-gray-800 p-5 glow-box-cyber space-y-2">
                    <div class="flex items-center justify-between text-gray-400">
                        <span>Active Shells</span>
                        <i class="ph ph-layout text-amber-400 text-xl"></i>
                    </div>
                    <p class="text-2xl font-bold text-white">5</p>
                    <span class="text-[10px] text-gray-400">public/*/index.php Clean-URL</span>
                </div>

                <div class="bg-gray-950/90 rounded-2xl border border-gray-800 p-5 glow-box-cyber space-y-2">
                    <div class="flex items-center justify-between text-gray-400">
                        <span>Router Proxy</span>
                        <i class="ph ph-flow-arrow text-emerald-400 text-xl"></i>
                    </div>
                    <p class="text-2xl font-bold text-emerald-400">ACTIVE</p>
                    <span class="text-[10px] text-gray-400">public/core/router.php proxy</span>
                </div>

                <div class="bg-gray-950/90 rounded-2xl border border-gray-800 p-5 glow-box-cyber space-y-2">
                    <div class="flex items-center justify-between text-gray-400">
                        <span>Build Engine</span>
                        <i class="ph ph-terminal text-indigo-400 text-xl"></i>
                    </div>
                    <p class="text-2xl font-bold text-white">STABLE</p>
                    <span class="text-[10px] text-indigo-400">Vibeforge Vibe Engine</span>
                </div>
            </div>
        </div>
    `,
    howto: `
        <div class="space-y-6 font-mono text-xs">
            <div class="bg-gray-950/90 rounded-2xl border border-gray-800 p-6 glow-box-cyber space-y-4">
                <h2 class="text-base font-bold text-white flex items-center gap-2">
                    <i class="ph ph-git-merge text-orange-400 text-lg"></i> VIBE CODING WORKFLOW STEPS
                </h2>
                <div class="grid md:grid-cols-3 gap-4">
                    <div class="p-4 rounded-xl bg-gray-900 border border-gray-800 space-y-2">
                        <span class="text-orange-400 font-bold">Step 1: Write Spec</span>
                        <p class="text-gray-300">Tulis kebutuhan aplikasi di docs/prd.md & docs/branding.md.</p>
                    </div>
                    <div class="p-4 rounded-xl bg-gray-900 border border-gray-800 space-y-2">
                        <span class="text-orange-400 font-bold">Step 2: AI Execution</span>
                        <p class="text-gray-300">Gunakan Claude Code CLI untuk mengaudit dan mengeksekusi fitur.</p>
                    </div>
                    <div class="p-4 rounded-xl bg-gray-900 border border-gray-800 space-y-2">
                        <span class="text-orange-400 font-bold">Step 3: Verification</span>
                        <p class="text-gray-300">Test secara manual di browser dan pastikan log debug bersih.</p>
                    </div>
                </div>
            </div>
        </div>
    `,
    structure: `
        <div class="space-y-6 font-mono text-xs">
            <div class="bg-gray-950/90 rounded-2xl border border-gray-800 p-6 glow-box-cyber space-y-4">
                <h2 class="text-base font-bold text-white flex items-center gap-2">
                    <i class="ph ph-tree-structure text-orange-400 text-lg"></i> PROJECT TREE ARCHITECTURE
                </h2>
                <div class="bg-gray-900 p-4 rounded-xl border border-gray-800 text-gray-300 space-y-1 overflow-x-auto">
                    <div>project-root/</div>
                    <div>├── public/                  <span class="text-gray-500 font-normal"><- document root Apache</span></div>
                    <div>│   ├── index.php            <span class="text-gray-500 font-normal"><- Shell landing page</span></div>
                    <div>│   ├── login/index.php      <span class="text-gray-500 font-normal"><- Shell auth login</span></div>
                    <div>│   ├── manajemen/index.php  <span class="text-gray-500 font-normal"><- Shell Super Admin</span></div>
                    <div>│   └── core/router.php      <span class="text-gray-500 font-normal"><- Router Proxy (WAJIB)</span></div>
                    <div>├── core/                    <span class="text-gray-500 font-normal"><- router.php, Repo.php (dual mode)</span></div>
                    <div>├── include/                 <span class="text-gray-500 font-normal"><- config.php, helper.php</span></div>
                    <div>└── modules/                 <span class="text-gray-500 font-normal"><- Modul AJAX per role</span></div>
                </div>
            </div>
        </div>
    `,
    profile: `
        <div class="max-w-xl space-y-6 font-mono text-xs">
            <div class="bg-gray-950/90 rounded-2xl border border-gray-800 p-6 glow-box-cyber space-y-6">
                <div class="flex items-center gap-4">
                    <div class="w-16 h-16 rounded-2xl bg-orange-500/20 border border-orange-500/40 flex items-center justify-center text-orange-400 font-bold text-xl">AC</div>
                    <div>
                        <h2 class="text-base font-bold text-white">Admin Creator</h2>
                        <p class="text-gray-400">admin@app.id</p>
                        <span class="px-2 py-0.5 rounded bg-orange-500/10 text-orange-400 border border-orange-500/30 text-[10px] uppercase font-bold mt-1 inline-block">Role: admin</span>
                    </div>
                </div>
            </div>
        </div>
    `
};

function nav(key) {
    const titles = {
        overview: '// CREATOR OVERVIEW',
        howto: '// VIBE CODING WORKFLOW',
        structure: '// PROJECT TREE ARCHITECTURE',
        profile: '// PROFIL CREATOR ADMIN'
    };
    document.getElementById('pageTitle').innerText = titles[key] || '// OVERVIEW';
    document.getElementById('content').innerHTML = V[key] || V.overview;

    ['overview', 'howto', 'structure', 'profile'].forEach(k => {
        const d = document.getElementById(`s-${k}`);
        const m = document.getElementById(`m-${k}`);
        if (d) d.className = (k === key) ? 'w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold bg-orange-500/10 text-orange-400 border border-orange-500/20 transition-all' : 'w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-gray-400 hover:bg-gray-900 hover:text-white transition-colors';
        if (m) m.className = (k === key) ? 'flex flex-col items-center gap-1 text-orange-400' : 'flex flex-col items-center gap-1 text-gray-400';
    });
}
nav('overview');

const html = document.documentElement;
function initTheme() {
    const saved = localStorage.getItem('theme') || 'dark';
    html.classList.toggle('dark', saved === 'dark');
    html.setAttribute('data-theme', saved);
}
document.getElementById('themeToggle')?.addEventListener('click', () => {
    const isDark = html.classList.toggle('dark');
    const mode = isDark ? 'dark' : 'light';
    html.setAttribute('data-theme', mode);
    localStorage.setItem('theme', mode);
});
initTheme();
</script>
</body>
</html>
